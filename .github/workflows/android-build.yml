name: Build Android App

on:
  push:
    branches:
      - main
      - master
      - chaithra
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug_apk'
        type: choice
        options:
          - 'debug_apk'
          - 'release_bundle'
          - 'both'

jobs:
  build:
    name: Build Android APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build:mobile

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        working-directory: ./frontend/android
        run: chmod +x gradlew

      # Optional: Decode release keystore if provided in GitHub Secrets
      - name: Prepare Keystore (if configured in Secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: ./frontend/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          cat <<EOF > keystore.properties
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # Optional: Add google-services.json if provided in GitHub Secrets
      - name: Inject google-services.json (if configured in Secrets)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        working-directory: ./frontend/android/app
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json

      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'debug_apk' || inputs.build_type == 'both' }}
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle (AAB for Play Store)
        if: ${{ inputs.build_type == 'release_bundle' || inputs.build_type == 'both' }}
        working-directory: ./frontend/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'debug_apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: vaikhanasa-nidhi-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release Bundle (AAB)
        if: ${{ inputs.build_type == 'release_bundle' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: vaikhanasa-nidhi-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
