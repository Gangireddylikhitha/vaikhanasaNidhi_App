# Blueprint: https://dashboard.render.com/blueprints
# Deploy: connect GitHub repo → New Blueprint → select this file
services:
  - type: web
    name: vaikhanasa-nidhi-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DISABLE_IN_PROCESS_CRON
        value: "true"
      # Optional — leave empty until Android push is configured
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""

  - type: cron
    name: vaikhanasa-panchangam-cron
    runtime: node
    rootDir: backend
    schedule: "5 * * * *"
    buildCommand: npm install
    startCommand: npm run cron:panchangam
    envVars:
      - key: MONGODB_URI
        fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: MONGODB_URI
      - key: PANCHANGAM_SYNC_HOUR_IST
        value: "5"
      - key: PANCHANGAM_PREFETCH_PER_NIGHT
        value: "8"
      - key: PANCHANGAM_PREFETCH_YEAR
        value: "2026"

  - type: cron
    name: vaikhanasa-notifications-cron
    runtime: node
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm run cron:notifications
    envVars:
      - key: MONGODB_URI
        fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: MONGODB_URI
      # Firebase optional — cron exits cleanly when not configured
      - key: NOTIFICATION_HOUR_IST
        value: "6"
      - key: ANDROID_NOTIFICATION_CHANNEL_ID
        value: vaikhanasa_daily
