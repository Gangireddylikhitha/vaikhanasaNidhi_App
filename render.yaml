# Blueprint: https://dashboard.render.com/blueprints
# Deploy: connect GitHub repo → New Blueprint → select this file
services:
  - type: web
    name: vaikhanasa-nidhi-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DISABLE_IN_PROCESS_CRON
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: cron
    name: vaikhanasa-panchangam-cron
    runtime: node
    rootDir: backend
    schedule: "5 * * * *"
    buildCommand: npm install
    startCommand: npm run cron:panchangam
    envVars:
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: MONGODB_URI
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: PANCHANGAM_SYNC_HOUR_IST
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: PANCHANGAM_PREFETCH_PER_NIGHT
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: PANCHANGAM_PREFETCH_YEAR

  - type: cron
    name: vaikhanasa-notifications-cron
    runtime: node
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm run cron:notifications
    envVars:
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: MONGODB_URI
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: FIREBASE_SERVICE_ACCOUNT_JSON
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: NOTIFICATION_HOUR_IST
      - fromService:
          name: vaikhanasa-nidhi-api
          type: web
          envVarKey: ANDROID_NOTIFICATION_CHANNEL_ID
